services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opsdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsdesk"]
      interval: 2s
      timeout: 3s
      retries: 30

  # API + web app on http://localhost:8000 (migrates and seeds on start)
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/opsdesk
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-please-change-0123456789}
      SEED_ITEMS: ${SEED_ITEMS:-5000}
      TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/opsdesk_test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Background worker: processes the outbox (notifications) with retries
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/opsdesk
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-please-change-0123456789}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
